<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Showcase | 213 MEECH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./photo.css">
    <link rel="stylesheet" href="./video-services.css">
    <link rel="stylesheet" href="./tag.css">
  </head>
  <body>
    <!-- Vanta.js topology backdrop — behind all page content -->
    <div id="vanta-bg"></div>

    <!-- Top Left Corner Text -->
    <div class="corner-text top-left">
      <span>IT'S MEECH'S</span><br>
      <span>TIME</span>
    </div>

    <!-- Top Center Logo -->
    <div class="logo">
      <a href="./index.html">
        <img src="/vistaarlogo.webp" alt="Vistaar Innovation Expansion" class="logo-img" />
      </a>
    </div>

    <!-- Top Right Corner Links -->
    <div class="corner-text top-right">
      <a href="#" aria-label="Email"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg></a>
      <a href="#" aria-label="Twitter"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.5 6.3c-.7.3-1.4.5-2.2.6.8-.5 1.4-1.2 1.7-2.1-.7.4-1.6.8-2.4.9-.7-.8-1.8-1.3-2.9-1.3-2.2 0-4 1.8-4 4 0 .3 0 .6.1.9-3.3-.2-6.3-1.8-8.3-4.2-.3.6-.5 1.2-.5 1.9 0 1.4.7 2.6 1.8 3.3-.6 0-1.2-.2-1.8-.5v.1c0 1.9 1.4 3.5 3.2 3.9-.3.1-.7.1-1.1.1-.3 0-.5 0-.8-.1.5 1.6 2 2.7 3.8 2.8-1.4 1.1-3.2 1.7-5.1 1.7-.3 0-.7 0-1-.1 1.8 1.2 4 1.9 6.3 1.9 7.5 0 11.6-6.2 11.6-11.6v-.5c.8-.6 1.5-1.3 2-2.1Z"/></svg></a>
      <a href="#" aria-label="Facebook"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21v-8h2.7l.4-3.1h-3.1V8c0-.9.2-1.5 1.6-1.5H17V3.6c-.3 0-1.3-.1-2.4-.1-2.4 0-4 1.5-4 4.1v2.3H8v3.1h2.6V21h2.9Z"/></svg></a>
      <a href="#" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="3.8"/><circle cx="17.2" cy="6.8" r="1"/></svg></a>
    </div>

    <!-- Content -->
    <main class="tag-page">
      <nav class="tag-breadcrumb">
        <a href="./video-services.html">Services</a>
        <span>/</span>
        <a href="./video-services.html" id="tag-breadcrumb-category">Category</a>
        <span>/</span>
        <span class="current" id="tag-breadcrumb-current">Tag</span>
      </nav>

      <!-- Full-bleed autoplaying reel behind the title. The clips are
           portrait (shot for Shorts), so a blurred backdrop fills the wide
           banner while the real video plays uncropped (object-fit: contain)
           on top of it. -->
      <div class="tag-hero-video-wrap">
        <div class="tag-hero-backdrop" id="tag-hero-backdrop"></div>
        <video id="tag-hero-video" class="tag-hero-video" autoplay muted loop playsinline></video>
        <div class="tag-hero-video-scrim"></div>
        <button class="tag-hero-mute is-muted" id="tag-hero-mute" aria-label="Toggle sound">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 9.5v5h3.5L12 18V6L7.5 9.5H4Z"/>
            <path class="mute-line" d="M17 8.5 21 15.5M21 8.5 17 15.5"/>
            <path class="wave-line" d="M16 9.2a4 4 0 0 1 0 5.6M18.5 7a7.5 7.5 0 0 1 0 10"/>
          </svg>
        </button>
        <div class="tag-hero-video-content">
          <span class="tag-hero-eyebrow" id="tag-hero-eyebrow">Category — Video Showcase</span>
          <h1 class="tag-hero-title" id="tag-hero-title">Tag</h1>
        </div>
      </div>

      <p class="tag-hero-blurb" id="tag-hero-blurb"></p>

      <div class="tag-grid" id="tag-grid">
        <!-- showcase items injected by tag.js -->
      </div>
    </main>

    <!-- Bottom bar with shared nav dial -->
    <div class="photo-bottom-bar">
      <div class="corner-text bottom-left">
        © All rights reserved. 2026
      </div>

      <div class="photo-menu-section">
        <div class="bottom-menu photo-page-menu">
          <div class="glass-ring"></div>
          <div class="bangle"></div>
          <div class="bangle-inner"></div>
          <div class="dial-highlight"></div>
          <div class="menu-items" id="rainbow-menu">
            <a href="./index.html" class="menu-item" data-index="0"><span>HOME</span></a>
            <a href="#" class="menu-item" data-index="1"><span>ABOUT US</span></a>
            <a href="#" class="menu-item" data-index="2"><span>PORTFOLIO</span></a>
            <a href="./photo.html" class="menu-item active" data-index="3"><span>SERVICES</span></a>
            <a href="#" class="menu-item" data-index="4"><span>SUBSCRIPTION</span></a>
            <a href="#" class="menu-item" data-index="5"><span>BOOK</span></a>
          </div>
        </div>
        <div class="dial-icon" id="dial-icon" aria-hidden="true"></div>
      </div>

      <div class="corner-text bottom-right">
        Site by TDP
      </div>
    </div>

    <script type="module" src="/tag.js"></script>
  </body>
</html>
