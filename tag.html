    <!-- Content -->

      <nav class="tag-breadcrumb">
        <a href="./services.html" id="tag-breadcrumb-root">Services</a>
        <span>/</span>
        <a href="./services.html" id="tag-breadcrumb-category">Category</a>
        <span>/</span>
        <span class="current" id="tag-breadcrumb-current">Tag</span>
      </nav>
      <h1 class="tag-title" id="tag-title">Video Showcase</h1>
      <p class="tag-hint" id="tag-hint">Click a card to play</p>
    </main>

    <!-- Two presentations for the same category reel, only one shown at a
         time (see tag.js): the Services flow gets a 3D drag carousel, the
         Portfolio flow gets the Fibonacci-sphere 3D gallery. -->
    <section class="coverflow-section" id="coverflow-section" hidden>
      <div class="coverflow" id="coverflow"></div>
    </section>

    <section class="stellar-gallery-section" id="stellar-gallery-section" hidden>
      <div class="stellar-gallery" id="stellar-gallery"></div>
    </section>

    <!-- Bottom bar with shared nav dial -->
    <div class="photo-bottom-bar">
      <div class="corner-text bottom-left">
        © All rights reserved. 2026
      </div>

      <div class="photo-menu-section">
        <div class="bottom-menu photo-page-menu">
          <div class="glass-ring"></div>
          <div class="bangle"></div>
          <div class="bangle-inner"></div>
          <div class="dial-highlight"></div>
          <div class="menu-items" id="rainbow-menu">
            <a href="./index.html" class="menu-item" data-index="0"><span>HOME</span></a>
            <a href="#" class="menu-item" data-index="1"><span>ABOUT US</span></a>
            <a href="./services.html" class="menu-item" data-index="2" id="tag-menu-services"><span>SERVICES</span></a>

            <a href="./subscription.html" class="menu-item" data-index="4"><span>SUBSCRIPTION</span></a>
            <a href="./booking.html" class="menu-item" data-index="5"><span>BOOK</span></a>

        </div>
