<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Set a new password | Vistaar Media</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./dashboard.css">
  </head>
  <body>
    <div class="dash-gate">
      <div class="dash-gate-card">
        <img src="/vistaarlogo.webp" alt="Vistaar" class="dash-gate-logo" />

        <!-- Shown while supabase-js parses the recovery token out of the URL -->
        <p class="dash-boot" id="reset-checking">Checking your reset link...</p>

        <form id="reset-form" hidden>
          <h1 class="dash-gate-title">Set a new password</h1>
          <p class="dash-gate-sub">Choose something at least 8 characters long.</p>

          <div class="dash-field">
            <label for="reset-password">New password</label>
            <input type="password" id="reset-password" autocomplete="new-password" minlength="8" required />
          </div>
          <div class="dash-field">
            <label for="reset-confirm">Confirm new password</label>
            <input type="password" id="reset-confirm" autocomplete="new-password" minlength="8" required />
          </div>

          <p class="dash-error" id="reset-error" hidden></p>

          <button type="submit" class="dash-btn dash-btn-primary dash-btn-block" id="reset-submit">Update password</button>
        </form>

        <div id="reset-done" hidden>
          <h1 class="dash-gate-title">Password updated</h1>
          <p class="dash-gate-sub">You can sign in to the dashboard with your new password.</p>
          <a class="dash-btn dash-btn-primary dash-btn-block" href="./dashboard.html" style="text-decoration:none;text-align:center;">Go to dashboard</a>
        </div>

        <div id="reset-invalid" hidden>
          <h1 class="dash-gate-title">Link expired</h1>
          <p class="dash-gate-sub" id="reset-invalid-msg">
            This reset link is no longer valid. Request a fresh one from the sign-in page.
          </p>
          <a class="dash-btn dash-btn-ghost dash-btn-block" href="./dashboard.html" style="text-decoration:none;text-align:center;">Back to sign in</a>
        </div>
      </div>
    </div>

    <script type="module" src="/reset-password.js"></script>
  </body>
</html>
