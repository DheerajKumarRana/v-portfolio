<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subscription | 213 MEECH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./photo.css">
    <link rel="stylesheet" href="./subscription.css">
    <link rel="stylesheet" href="./starfield.css">
  </head>
  <body>
    <!-- Top Center Logo -->
    <div class="logo">
      <a href="./index.html">
        <img src="/vistaarlogo.webp" alt="Vistaar Innovation Expansion" class="logo-img" />
      </a>
    </div>

    <!-- Top Right Corner Links -->
    <div class="corner-text top-right">
      <a href="#" aria-label="Email"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg></a>
      <a href="#" aria-label="Twitter"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.5 6.3c-.7.3-1.4.5-2.2.6.8-.5 1.4-1.2 1.7-2.1-.7.4-1.6.8-2.4.9-.7-.8-1.8-1.3-2.9-1.3-2.2 0-4 1.8-4 4 0 .3 0 .6.1.9-3.3-.2-6.3-1.8-8.3-4.2-.3.6-.5 1.2-.5 1.9 0 1.4.7 2.6 1.8 3.3-.6 0-1.2-.2-1.8-.5v.1c0 1.9 1.4 3.5 3.2 3.9-.3.1-.7.1-1.1.1-.3 0-.5 0-.8-.1.5 1.6 2 2.7 3.8 2.8-1.4 1.1-3.2 1.7-5.1 1.7-.3 0-.7 0-1-.1 1.8 1.2 4 1.9 6.3 1.9 7.5 0 11.6-6.2 11.6-11.6v-.5c.8-.6 1.5-1.3 2-2.1Z"/></svg></a>
      <a href="#" aria-label="Facebook"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21v-8h2.7l.4-3.1h-3.1V8c0-.9.2-1.5 1.6-1.5H17V3.6c-.3 0-1.3-.1-2.4-.1-2.4 0-4 1.5-4 4.1v2.3H8v3.1h2.6V21h2.9Z"/></svg></a>
      <a href="#" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="3.8"/><circle cx="17.2" cy="6.8" r="1"/></svg></a>
    </div>

    <main class="sub-page">
      <!-- Screen 1: pick a service. Hover a title to preview its image
           (see subscription.js); click to reveal that service's plans. -->
      <section class="sub-select" id="sub-select">
        <span class="sub-eyebrow">213 MEECH — SUBSCRIPTION — Hover a service · Click to see plans</span>
        <div class="sub-select-grid">
          <div class="sub-select-list" id="sub-select-list">
            <!-- items injected by subscription.js -->
          </div>
          <div class="sub-select-media" id="sub-select-media">
            <!-- images injected by subscription.js -->
          </div>
        </div>
      </section>

      <!-- Screen 2: plans for the picked service — hidden until a service
           is chosen above. -->
      <section class="sub-pricing" id="sub-pricing" hidden>
        <nav class="sub-breadcrumb">
          <button type="button" class="sub-back" id="sub-back">&larr; All services</button>
          <span>/</span>
          <span class="current" id="sub-pricing-service">Service</span>
        </nav>

        <div class="sub-pricing-head">
          <div class="sub-pricing-head-text">
            <h1 class="sub-pricing-title">Plans &amp; Pricing</h1>
            <p class="sub-pricing-sub" id="sub-pricing-sub">Pick a cadence that matches how often you need new content.</p>
          </div>

          <div class="sub-switch" id="sub-switch">
            <button type="button" class="sub-switch-btn is-active" data-period="monthly">Monthly</button>
            <button type="button" class="sub-switch-btn" data-period="yearly">Yearly <span class="sub-switch-save">Save 17%</span></button>
            <span class="sub-switch-thumb" id="sub-switch-thumb"></span>
          </div>
        </div>

        <div class="sub-pricing-grid" id="sub-pricing-grid">
          <!-- plan cards injected by subscription.js -->
        </div>

        <!-- Feature-by-feature breakdown of the same 3 plans — desktop/tablet
             only, the cards above already cover this on mobile. -->
        <section class="sub-compare" id="sub-compare">
          <h2 class="sub-compare-title">Detailed feature comparison</h2>
          <div class="sub-compare-scroll">
            <table class="sub-compare-table" id="sub-compare-table">
              <!-- head + rows injected by subscription.js -->
            </table>
          </div>
        </section>
      </section>
    </main>

    <!-- Bottom bar with shared nav dial -->
    <div class="photo-bottom-bar">
      <div class="corner-text bottom-left">
        © All rights reserved. 2026
      </div>

      <div class="photo-menu-section">
        <div class="bottom-menu photo-page-menu">
          <div class="glass-ring"></div>
          <div class="bangle"></div>
          <div class="bangle-inner"></div>
          <div class="dial-highlight"></div>
          <div class="menu-items" id="rainbow-menu">
            <a href="./index.html" class="menu-item" data-index="0"><span>HOME</span></a>
            <a href="#" class="menu-item" data-index="1"><span>ABOUT US</span></a>
            <a href="./services.html" class="menu-item" data-index="2"><span>SERVICES</span></a>
            <a href="./photo.html" class="menu-item" data-index="3"><span>PORTFOLIO</span></a>
            <a href="./subscription.html" class="menu-item active" data-index="4"><span>SUBSCRIPTION</span></a>
            <a href="./booking.html" class="menu-item" data-index="5"><span>BOOK</span></a>
          </div>
        </div>
        <div class="dial-icon" id="dial-icon" aria-hidden="true"></div>
      </div>

    </div>

    <script type="module" src="/subscription.js"></script>
  </body>
</html>
